name: weread2notion sync
description: Sync WeRead highlights and notes to Notion.
author: malinkang

inputs:
  weread-api-key:
    description: WeRead Gateway API key.
    required: true
  notion-token:
    description: Notion integration token.
    required: true
  notion-page:
    description: Notion database page URL or database ID.
    required: false
  notion-database-id:
    description: Notion database ID. Used when notion-page is not set.
    required: false
  notion-data-source-id:
    description: Notion data source ID. Preferred for Notion-Version 2026-03-11.
    required: false
  properties-only:
    description: Refresh existing book properties without changing notes.
    required: false
    default: "false"
  dry-run:
    description: Preview changes without writing to Notion.
    required: false
    default: "false"
  full-refresh:
    description: Audit all notes and refresh static metadata without deleting pages.
    required: false
    default: "false"
  book-id:
    description: Limit the run to one WeRead book ID.
    required: false
  python-version:
    description: Python version used to run the sync.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install weread2notion
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "$GITHUB_ACTION_PATH"
    - name: Sync WeRead to Notion
      shell: bash
      env:
        WEREAD_API_KEY: ${{ inputs.weread-api-key }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
        NOTION_PAGE: ${{ inputs.notion-page }}
        NOTION_DATABASE_ID: ${{ inputs.notion-database-id }}
        NOTION_DATA_SOURCE_ID: ${{ inputs.notion-data-source-id }}
        PROPERTIES_ONLY: ${{ inputs.properties-only }}
        DRY_RUN: ${{ inputs.dry-run }}
        FULL_REFRESH: ${{ inputs.full-refresh }}
        BOOK_ID: ${{ inputs.book-id }}
      run: |
        args=(sync)
        if [[ "$PROPERTIES_ONLY" == "true" ]]; then args+=(--properties-only); fi
        if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
        if [[ "$FULL_REFRESH" == "true" ]]; then args+=(--full-refresh); fi
        if [[ -n "$BOOK_ID" ]]; then args+=(--book-id "$BOOK_ID"); fi
        weread2notion "${args[@]}"
