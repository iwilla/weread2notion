name: weread sync

on:
  workflow_dispatch:
    inputs:
      properties-only:
        description: "只补齐书籍属性，保留笔记正文"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: weread-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: WeRead to Notion
        uses: ./
        with:
          properties-only: ${{ inputs.properties-only || false }}
          weread-api-key: ${{ secrets.WEREAD_API_KEY }}
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-page: ${{ secrets.NOTION_PAGE }}
          notion-database-id: ${{ secrets.NOTION_DATABASE_ID }}
          notion-data-source-id: ${{ secrets.NOTION_DATA_SOURCE_ID }}
